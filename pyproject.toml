[project]
name = "pm-graph-engine"
version = "0.1.0"
description = "DAG-based workflow execution engine for pm-chain"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
]

[project.scripts]
pm-graph = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"
